# Source is the only one branch of the logic tree from Stucchi et al. 2011
# - Varied parameters: M max , hypocenter depth, a-and b- values 

[general]
description = Seismic hazard analysis for Italy - simplified model
#calculation_mode = classical
calculation_mode = disaggregation
random_seed = 5

[geometry]

[calculation]
source_model_logic_tree_file = inputs_1/ssmLT.xml
gsim_logic_tree_file = inputs_1/gmmLT.xml
investigation_time = 50.0
intensity_measure_types_and_levels = {
  "PGA": logscale(.001, 20, 80),
  'SA(0.05)': logscale(.001, 20, 80),
  'SA(0.075)': logscale(.001, 20, 80),
  "SA(0.1)": logscale(.001, 20, 80),
  "SA(0.2)": logscale(.001, 20, 80),
  "SA(0.3)": logscale(.001, 20, 80),
  "SA(0.4)": logscale(.001, 20, 80),
  "SA(0.5)": logscale(.001, 20, 80),
  "SA(0.6)": logscale(.001, 20, 80),
  "SA(0.7)": logscale(.001, 20, 80),
  "SA(0.8)": logscale(.001, 20, 80),
  "SA(0.9)": logscale(.001, 20, 80),
  "SA(1.0)": logscale(.001, 20, 80),
  "SA(1.1)": logscale(.001, 20, 80),
  "SA(1.2)": logscale(.001, 20, 80),
  "SA(1.3)": logscale(.001, 20, 80),
  "SA(1.4)": logscale(.001, 20, 80),
  "SA(1.5)": logscale(.001, 20, 80),
  "SA(1.6)": logscale(.001, 20, 80),
  "SA(1.7)": logscale(.001, 20, 80),
  "SA(1.8)": logscale(.001, 20, 80),
  "SA(1.9)": logscale(.001, 20, 80),
  "SA(2.0)": logscale(.001, 20, 80),
  "SA(2.1)": logscale(.001, 20, 80),
  "SA(2.2)": logscale(.001, 20, 80),
  "SA(2.3)": logscale(.001, 20, 80),
  "SA(2.4)": logscale(.001, 20, 80),
  "SA(2.5)": logscale(.001, 20, 80),
  "SA(2.6)": logscale(.001, 20, 80),
  "SA(2.7)": logscale(.001, 20, 80),
  "SA(2.8)": logscale(.001, 20, 80),
  "SA(2.9)": logscale(.001, 20, 80),
  "SA(3.0)": logscale(.001, 20, 80),
  "Sa_avg2(0.5)": logscale(.001, 20, 80),
  "Sa_avg2(1.0)": logscale(.001, 20, 80),
  "Sa_avg2(1.5)": logscale(.001, 20, 80),
  "Sa_avg2(2.0)": logscale(.001, 20, 80),
  "Sa_avg3(0.5)": logscale(.001, 20, 80),
  "Sa_avg3(1.0)": logscale(.001, 20, 80),
  "Sa_avg3(1.5)": logscale(.001, 20, 80),
  "Sa_avg3(2.0)": logscale(.001, 20, 80),
  "PGV": logscale(.001, 500, 80),
  "FIV3(0.5)": logscale(.001, 500, 80),
  "FIV3(1.0)": logscale(.001, 500, 80),
  "FIV3(1.5)": logscale(.001, 500, 80),
  "FIV3(2.0)": logscale(.001, 500, 80),
  }

truncation_level = 3
maximum_distance = 50

[erf]
rupture_mesh_spacing = 2
width_of_mfd_bin = 0.2
area_source_discretization = 10.0

[site_params]
site_model_file = inputs_1/rivisondoli.csv
#site_model_file = inputs_1/laquila.csv

[disaggregation]
mag_bin_width=0.5
distance_bin_width=10.0
coordinate_bin_width=10.0
num_epsilon_bins=3
disagg_outputs = Mag_Dist, Mag_Dist_Eps, TRT

[output]
poes = 0.4, 0.2, 0.1, 0.05, 0.02, 0.01, 0.005, 0.0025, 0.001, 0.0004, 0.0002, 0.0001
mean_hazard_curves = true
hazard_maps = false
uniform_hazard_spectra = false
export_dir = ./data/
