[project]
name = "djura"
# Version is set dynamically from git tags by poetry-dynamic-versioning.
# The placeholder below is overwritten at build time; do not bump it by hand.
dynamic = ["version"]
description = "Scientific Python toolkit for earthquake engineering: GCIM-based ground motion record selection, hazard consistency, vulnerability modelling, and storey loss functions."
authors = [
    { name = "Djura | Risk - Data - Engineering S.r.l.", email = "info@djura.it" },
]
readme = "README.md"
license = "AGPL-3.0-later"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
keywords = [
    "earthquake-engineering",
    "seismic-hazard",
    "ground-motion-selection",
    "gcim",
    "vulnerability",
    "fragility",
    "storey-loss-function",
    "performance-based-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
# Core dependencies shared by every submodule. Everything else is declared
# as a per-application extra below; see [project.optional-dependencies].
dependencies = [
    "numpy (>=1.26)",
    "scipy (>=1.14)",
    "pydantic (>=2.13.4,<3.0.0)",
]

[project.urls]
Homepage = "https://github.com/djura-risk-data-engineering/djura"
Repository = "https://github.com/djura-risk-data-engineering/djura"
Issues = "https://github.com/djura-risk-data-engineering/djura/issues"
Changelog = "https://github.com/djura-risk-data-engineering/djura/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# --- Per-application extras
# Install only what a given submodule needs, e.g.
#     pip install "djura[record_selection]"
# Extras are additive, so combining them works as expected:
#     pip install "djura[record_selection,slf]"
#
# Where one application builds on another, the dependants repeat the required
# packages explicitly rather than self-referencing (``djura[...]``), which is
# supported by pip but handled inconsistently by other installers.

# djura.record_selection - GCIM-based ground motion record selection.
record_selection = [
    "numba (>=0.59)",
    "pandas (>=2.2)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "requests (>=2.32)",
    "shapely (>=2.1.2,<3.0.0)",
    "statsmodels (>=0.14.6,<0.15.0)",
]

# djura.hazard_consistency - hazard-consistent IM analysis.
# Requires nothing beyond the core; the extra exists so that the install
# command is uniform across applications and stays stable if that changes.
hazard_consistency = []

# djura.fragility_converter - fragility/vulnerability conversion across IMs.
# Imports djura.record_selection, so it needs that application's packages.
fragility_converter = [
    "numba (>=0.59)",
    "pandas (>=2.2)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "statsmodels (>=0.14.6,<0.15.0)",
]

# djura.slf - storey loss function generation.
slf = ["pandas (>=2.2)"]

# djura.vulnerability_modeller - seismic vulnerability and loss modelling.
vulnerability_modeller = [
    "pwlf (>=2.5.2,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
]

# djura.edp_im - ML-based EDP-IM relationship prediction.
# edp_im and vulnerability_modeller import each other, so they share a
# dependency set; installing either makes both usable.
edp_im = [
    "pwlf (>=2.5.2,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
]

# --- Optional accelerators / file formats -----------------------------------
hdf5 = ["h5py (>=3.16,<4)"]        # GMPETable support in record_selection
xgboost = ["xgboost (>=1.7)"]      # gradient-boosted models in edp_im

# --- Plotting ---------------------------------------------------------------
# Nothing in the package requires it; it is needed to redraw the figures of the
# validation cases under tests/rs/validations, which are skipped without it.
plot = ["matplotlib (>=3.8)"]

# --- Everything -------------------------------------------------------------
# Equivalent to the pre-2.0 behaviour of a bare ``pip install djura``.
all = [
    "h5py (>=3.16,<4)",
    "numba (>=0.59)",
    "pandas (>=2.2)",
    "pwlf (>=2.5.2,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "requests (>=2.32)",
    "shapely (>=2.1.2,<3.0.0)",
    "statsmodels (>=0.14.6,<0.15.0)",
    "xgboost (>=1.7)",
]

[tool.poetry]
packages = [{ include = "djura", from = "src" }]
include = [{ path = "src/djura/py.typed" }]
exclude = [
    "dump",
    "htmlcov",
    "venv",
    ".venv",
    "tests",
    "docs",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pickle",
    "**/*.pkl",
    "**/*.pickle.gz",
    "**/*.pkl.gz",
    "**/.env",
    "**/.env.*",
]
version = "0.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "poetry-dynamic-versioning>=1.4.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"
# Match tags like v1.2.3 or v1.2.3rc1; the leading "v" is stripped.
pattern = "default-unprefixed"
# On a tag, the tag itself, pre-release segment included, so that v2.0.0rc1
# builds as 2.0.0rc1. Off a tag, a dev/local segment is appended so wheels
# uploaded by accident never collide with a real release.
format-jinja = """
    {%- if distance == 0 -%}
        {{ serialize_pep440(base, stage, revision) }}
    {%- else -%}
        {{ serialize_pep440(base, stage, revision, dev=distance,
                            metadata=[commit]) }}
    {%- endif -%}
"""

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "schema (>=0.7.8,<0.8.0)",
]
docs = [
    "sphinx (>=8.1.3)",
    "furo (>=2025.12.19)",
    # sphinx-autodoc-typehints >=3.10 requires Sphinx >=9.1, which in turn
    # requires Python >=3.12. Poetry does not propagate the marker below to
    # Sphinx's own Python requirement, so a tighter floor here makes the
    # docs group unresolvable on Python 3.10/3.11.
    "sphinx-autodoc-typehints>=2.3; python_version >= '3.12'",
    # myst-parser 5.x requires Python >=3.11 and Sphinx >=8; the 4.x series
    # is the newest supporting Python 3.10 and pins Sphinx <9. Splitting by
    # Python version keeps a consistent Sphinx solution on every supported
    # interpreter.
    "myst-parser>=4.0,<5; python_version < '3.11'",
    "myst-parser>=5.0; python_version >= '3.11'",
]

[tool.coverage.run]
branch = true
source = ["src/djura"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
